id = "envvar.herd-trail"
name = "Trail"
version = "0.2.1"
min_herdr_version = "0.8.0" # 实测基线:agent focus / plugin pane close <pane_id>
description = "Herd-wide shared memos: agents jot follow-ups mid-conversation, humans manage one global list, every entry links back to the conversation that created it (focus or resume)."
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Open trail list"
contexts = ["workspace"]
command = ["node", "src/open-action.js"]

[[actions]]
id = "agent-setup"
title = "Install pi tools + skill"
contexts = ["workspace"]
command = ["node", "src/agent-setup.js"]

[[panes]]
id = "list"
title = "Trail"
placement = "popup"
width = 120
height = 34
command = ["node", "src/overlay.js"]
